groups:
  # ---------------------------------------------------------------------------
  # Disponibilidade
  # ---------------------------------------------------------------------------
  - name: mini-noc-availability
    rules:
      - alert: WebDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
          service: web
        annotations:
          summary: "Site fora do ar (app.local/healthz)"
          description: "O probe HTTP falhou por mais de 1 minuto. Comece por runbooks/web-down.md."
          runbook: "runbooks/web-down.md"

      - alert: ApiDegraded
        expr: probe_success{job="blackbox-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API degradada (app.local/api/status)"
          description: "A API não devolve 200. Pode ser o banco ou a própria API. Runbook: runbooks/api-degraded.md"
          runbook: "runbooks/api-degraded.md"

      - alert: DNSFailure
        expr: probe_success{job="blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
          service: dns
        annotations:
          summary: "Resolução de nomes interna falhando"
          description: "O CoreDNS não respondeu app.local com NOERROR. Runbook: runbooks/dns-failure.md"
          runbook: "runbooks/dns-failure.md"

      - alert: DBDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 1m
        labels:
          severity: critical
          service: db
        annotations:
          summary: "Banco de dados inacessível na porta 5432"
          description: "O handshake TCP com o Postgres falhou. Runbook: runbooks/db-down.md"
          runbook: "runbooks/db-down.md"

  # ---------------------------------------------------------------------------
  # Desempenho
  # ---------------------------------------------------------------------------
  - name: mini-noc-performance
    rules:
      - alert: HighLatency
        expr: probe_duration_seconds{job="blackbox-http"} > 0.8
        for: 2m
        labels:
          severity: warning
          service: web
        annotations:
          summary: "Latência do site acima de 800 ms"
          description: "O serviço responde, mas devagar. Runbook: runbooks/high-latency.md"
          runbook: "runbooks/high-latency.md"

      - alert: HostDiskPressure
        expr: >-
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}) > 0.85
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Disco do host acima de 85%"
          description: "Pouco espaço livre na raiz do host. Runbook: runbooks/disk-pressure.md"
          runbook: "runbooks/disk-pressure.md"
